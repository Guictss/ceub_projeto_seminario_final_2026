[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html
markers =
    slow: testes mais lentos (PDF, etc)
    integration: testes de integração