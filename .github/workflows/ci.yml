name: CI

on:
  push:
    branches:
      - main
      - apresentacao-ceub
  pull_request:
    branches:
      - main

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Backend — pytest + cobertura mínima de 80%
  # ═══════════════════════════════════════════════════════════════
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage (fail if < 80%)
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-secret-key-only-for-tests-not-production
          JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-bytes-long-for-ci
        run: pytest --cov-fail-under=80

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # Frontend — build do Vite (confirma que compila)
  # ═══════════════════════════════════════════════════════════════
  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API_URL: http://localhost:5000/api/v1
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # Lint do backend — Ruff
  # ═══════════════════════════════════════════════════════════════
  lint-backend:
    name: Lint Backend (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check .

  # ═══════════════════════════════════════════════════════════════
  # Lint do frontend — ESLint
  # ═══════════════════════════════════════════════════════════════
  lint-frontend:
    name: Lint Frontend (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint